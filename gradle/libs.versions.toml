[versions]
kotlin = "2.3.10" # https://github.com/JetBrains/kotlin/releases
twitch4j = "1.27.0" # https://github.com/twitch4j/twitch4j/releases
ktor = "3.6.0" # https://github.com/ktorio/ktor/releases
jackson = "2.22.2" # Version used by Twitch4j
logback = "1.6.6" # https://mvnrepository.com/artifact/ch.qos.logback/logback-classic

kordex-plugin = "1.9.2" # https://docs.kordex.dev/bots/gradle-plugin/
kordex-i18n-plugin = "1.1.1" # https://docs.kordex.dev/i18n/getting-started

[libraries]
twitch4j = { module = "com.github.twitch4j:twitch4j-helix", version.ref = "twitch4j" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-contentnegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson", version.ref = "ktor" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-dataformat-properties = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-properties", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
kordex = { id = "dev.kordex.gradle.kordex", version.ref = "kordex-plugin" }
kordex-i18n = { id = "dev.kordex.gradle.i18n", version.ref = "kordex-i18n-plugin" }
